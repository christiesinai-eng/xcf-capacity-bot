<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>XCF Roadmap Timeline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#000856;color:#fff;min-height:100vh}

:root{
  --midnight:#000856;
  --xero-blue:#3eccff;
  --xui-blue:#1f65d6;
  --gold:#fdcc08;
  --coral:#3eccff;
  --purple:#cf89fe;
  --mint:#e99000;
  --warm-grey:#f2f1ee;
  --mid-grey:#cbcac9;
  --surface:rgba(255,255,255,0.06);
  --surface2:rgba(255,255,255,0.10);
  --border:rgba(255,255,255,0.12);
}

/* ── HEADER ── */
.header{
  background:#000856;
  border-bottom:1px solid var(--border);
  padding:20px 28px 0;
  position:sticky;top:0;z-index:100;
}
.header-top{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.xcf-logo{
  background:linear-gradient(135deg,#3eccff 0%,#1f65d6 100%);
  color:#fff;font-size:11px;font-weight:800;padding:4px 12px;
  border-radius:20px;letter-spacing:.1em;text-transform:uppercase;
}
.header-title{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.02em}
.header-sub{font-size:13px;color:var(--mid-grey);margin-top:2px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:16px;align-items:center}
.legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mid-grey)}
.legend-dot{width:12px;height:12px;border-radius:3px}
.legend-dot.prod{background:#3eccff}
.legend-dot.mkt{background:#e99000}
.legend-dot.brief{background:#ff719b}

/* ── CONTROLS ── */
.controls{
  display:flex;gap:10px;padding:12px 28px;
  background:rgba(0,8,86,0.95);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center
}
.ctrl-label{font-size:12px;color:var(--mid-grey);font-weight:500}
.filter-btn{
  font-size:12px;font-weight:500;padding:6px 14px;border-radius:6px;
  border:1px solid var(--border);cursor:pointer;
  background:var(--surface);color:var(--warm-grey);transition:all .15s;white-space:nowrap
}
.filter-btn.active{background:var(--xui-blue);color:#fff;border-color:var(--xui-blue)}
.filter-btn:hover:not(.active){background:var(--surface2)}
.search-wrap{margin-left:auto}
.search{
  background:var(--surface);border:1px solid var(--border);
  border-radius:6px;padding:6px 12px;color:#fff;font-size:12px;
  outline:none;width:220px
}
.search:focus{border-color:var(--xero-blue)}
.search::placeholder{color:var(--mid-grey)}

/* ── STATS BAR ── */
.stats-bar{
  display:flex;gap:0;border-bottom:1px solid var(--border);
  background:rgba(0,8,86,0.95);padding:0 28px;
}
.stat{padding:12px 20px;border-right:1px solid var(--border);text-align:center}
.stat:first-child{padding-left:0}
.stat .sv{font-size:22px;font-weight:700;line-height:1}
.stat .sl{font-size:11px;color:var(--mid-grey);margin-top:3px;font-weight:500;letter-spacing:.02em}
.stat.blue .sv{color:var(--xero-blue)}
.stat.coral .sv{color:var(--coral)}
.stat.mint .sv{color:var(--mint)}
.stat.gold .sv{color:var(--gold)}

/* ── MAIN CONTENT ── */
.main{padding:24px 28px 24px;max-width:100%}

/* ── TIMELINE ── */
.timeline-container{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}

/* Scroll wrapper — label col is sticky, bars scroll horizontally */
.timeline-scroll{overflow-x:auto;overflow-y:visible}
.timeline-inner{display:flex;flex-direction:column;min-width:max-content}

/* Month header */
.month-header{
  display:flex;
  background:rgba(255,255,255,0.04);
  border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:20;
}
.month-header .row-label{
  width:280px;min-width:280px;padding:10px 16px;
  font-size:11px;font-weight:600;color:var(--mid-grey);
  border-right:1px solid var(--border);letter-spacing:.05em;text-transform:uppercase;
  position:sticky;left:0;background:rgba(0,8,86,0.98);z-index:21;flex-shrink:0;
}
.month-header .months{display:flex}
.month-cell{
  width:90px;min-width:90px;text-align:center;font-size:11px;font-weight:600;
  color:var(--mid-grey);padding:10px 4px;letter-spacing:.04em;
  border-right:1px solid rgba(255,255,255,0.05);white-space:nowrap;
}
.month-cell.now{color:var(--xero-blue);background:rgba(62,204,255,0.06)}
.month-cell.fy-start{border-left:2px solid rgba(253,204,8,0.4)}
.month-header .row-label-inner{display:flex;align-items:center}

/* FY label strip */
.fy-strip{
  display:flex;border-bottom:1px solid var(--border);
  background:rgba(0,8,86,0.6);
}
.fy-label-spacer{width:280px;min-width:280px;flex-shrink:0;position:sticky;left:0;background:rgba(0,8,86,0.98);border-right:1px solid var(--border);z-index:21}
.fy-cells{display:flex}
.fy-cell{
  text-align:center;font-size:10px;font-weight:700;color:var(--gold);
  padding:4px 8px;letter-spacing:.06em;text-transform:uppercase;
  border-right:1px solid rgba(255,255,255,0.05);
}

/* Row */
.gantt-row{
  display:flex;align-items:stretch;border-bottom:1px solid var(--border);
  transition:background .1s;
}
.gantt-row:last-child{border-bottom:none}
.gantt-row:nth-child(odd){background:rgba(255,255,255,0.0)}
.gantt-row:nth-child(even){background:rgba(255,255,255,0.04)}
.gantt-row:hover{background:rgba(62,204,255,0.05)}
.gantt-row.hidden{display:none}

.row-label{
  width:280px;min-width:280px;padding:10px 16px;
  border-right:1px solid var(--border);display:flex;flex-direction:column;justify-content:center;gap:4px;
  position:sticky;left:0;background:#060e2a;z-index:10;flex-shrink:0;
}
.gantt-row:nth-child(even) .row-label{background:#07102a}
.gantt-row:hover .row-label{background:#0c1f40}
.row-name{font-size:12px;font-weight:600;color:#fff;line-height:1.3}
.row-code{font-size:10px;color:var(--mid-grey);font-weight:500}
.row-status{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.05em}
.row-status.completed{background:rgba(233,144,0,.15);color:#e99000}
.row-status.active{background:rgba(62,204,255,.15);color:var(--xero-blue)}
.row-status.upcoming{background:rgba(253,204,8,.10);color:var(--gold)}

.row-bars{
  position:relative;padding:6px 0;display:flex;flex-direction:column;gap:3px;
  min-height:52px;
}
.bar-track{position:relative;height:18px;flex-shrink:0}
.bar{
  position:absolute;height:100%;border-radius:4px;
  display:flex;align-items:center;padding:0 6px;
  font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:4px;cursor:default;transition:opacity .15s;
}
.bar:hover{opacity:.85}
.bar.prod{background:var(--coral);color:#000856}
.bar.mkt{background:var(--mint);color:#000856}
.bar.brief{background:#ff719b;color:#000856}
.bar.prod-dot{width:8px!important;border-radius:50%;padding:0}
.bar.mkt-dot{width:8px!important;border-radius:50%;padding:0}
.bar.brief-dot{width:8px!important;border-radius:50%;padding:0}

/* Tooltip */
.bar[data-tip]{position:relative}
.bar[data-tip]:hover::after{
  content:attr(data-tip);
  position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:#0d1429;border:1px solid var(--border);
  color:#fff;font-size:11px;padding:6px 10px;border-radius:6px;
  white-space:nowrap;z-index:200;pointer-events:none;
  box-shadow:0 4px 16px rgba(0,0,0,.4)
}

/* Today line */
.today-line{
  position:absolute;top:0;bottom:0;width:2px;background:var(--gold);
  z-index:10;pointer-events:none;
}
.today-label{
  position:absolute;top:-22px;transform:translateX(-50%);
  font-size:10px;font-weight:700;color:var(--gold);white-space:nowrap;
}

/* Grid lines */
.grid-line{
  position:absolute;top:0;bottom:0;width:1px;
  background:rgba(255,255,255,0.04);pointer-events:none;
}

/* No results */
.no-results{text-align:center;padding:40px;color:var(--mid-grey);font-size:14px}

/* Footer */
.footer{text-align:center;padding:20px;font-size:11px;color:var(--mid-grey);opacity:.6}

@media(max-width:768px){
  .row-label{width:160px;min-width:160px}
  .header-right{display:none}
}
</style>
</head>

function parseDate(s){ return s ? new Date(s + 'T00:00:00') : null }
function fmtDate(d){
  if(!d) return '';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
}
function fmtDateShort(d){
  if(!d) return '';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

function cleanName(raw){
  // Remove leading [Converted to project] prefix
  let s = raw.replace(/^\[Converted to project\]\s*/,'').trim();
  // Split by ' | ' and take the last meaningful segment
  const parts = s.split(' | ').map(p => p.trim()).filter(p =>
    p && !p.match(/^XCFP?-\d+$/) && !p.match(/^XCFT-\d+$/) &&
    !p.match(/^\[no value\]$/) && !p.match(/^FY\d+\s*Q\d.*$/) &&
    !p.match(/^20\d\d$/) && p !== 'HUB delivery support' &&
    p !== 'XCF delivery support'
  );
  return parts[parts.length - 1] || s;
}

function getCode(raw){
  const m = raw.match(/XCFP?-\d+|XCFT-\d+/);
  return m ? m[0] : '';
}

// ─── PROCESS ─────────────────────────────────────────────────────────────────
const TODAY = new Date('2026-08-25T00:00:00');

const projects = RAW_TASKS.map(t => {
  const prod  = t.subtasks.find(s => s.name.trim() === 'Production');
  const mkt   = t.subtasks.find(s => s.name.trim() === 'In Market');
  const brief = t.subtasks.find(s => /project brief due/i.test(s.name.trim()));
  return {
    name: cleanName(t.name),
    code: getCode(t.name),
    completed: t.completed,
    production: prod && prod.due_on ? {
      start: parseDate(prod.start_on) || parseDate(prod.due_on),
      end:   parseDate(prod.due_on)
    } : null,
    inMarket: mkt && mkt.due_on ? {
      start: parseDate(mkt.start_on) || parseDate(mkt.due_on),
      end:   parseDate(mkt.due_on)
    } : null,
    projectBrief: brief && brief.due_on ? {
      start: parseDate(brief.start_on) || parseDate(brief.due_on),
      end:   parseDate(brief.due_on)
    } : null,
  };
}).filter(p => p.production || p.inMarket || p.projectBrief);

// Sort by earliest date
projects.sort((a,b) => {
  const aMin = Math.min(
    a.production ? a.production.start : Infinity,
    a.inMarket   ? a.inMarket.start   : Infinity
  );
  const bMin = Math.min(
    b.production ? b.production.start : Infinity,
    b.inMarket   ? b.inMarket.start   : Infinity
  );
  return aMin - bMin;
});

// ─── TIMELINE RANGE ──────────────────────────────────────────────────────────
// FY27 = Apr 2026 – Mar 2027, plus buffer months either side
const RANGE_START = new Date('2026-01-01T00:00:00');
const RANGE_END   = new Date('2027-04-01T00:00:00');
const MONTH_PX    = 110; // pixels per month — wide enough to read clearly

function monthsBetween(a, b){
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
}
const TOTAL_MONTHS = monthsBetween(RANGE_START, RANGE_END);
const TOTAL_WIDTH  = TOTAL_MONTHS * MONTH_PX;

function px(d){
  if(!d) return 0;
  const clamped = new Date(Math.max(RANGE_START, Math.min(RANGE_END, d)));
  const ms = clamped - RANGE_START;
  const totalMs = RANGE_END - RANGE_START;
  return Math.round(ms / totalMs * TOTAL_WIDTH);
}

// ─── MONTH HEADERS ───────────────────────────────────────────────────────────
// FY27 = Apr 2026–Mar 2027
const FY27_START = new Date('2026-04-01T00:00:00');
const FY27_END   = new Date('2027-04-01T00:00:00');

function buildMonthHeaders(){
  const container = document.getElementById('monthCells');
  const months = [];
  let cur = new Date(RANGE_START);
  while(cur < RANGE_END){
    months.push(new Date(cur));
    cur.setMonth(cur.getMonth()+1);
  }
  months.forEach(m => {
    const div = document.createElement('div');
    div.className = 'month-cell';
    div.style.width = MONTH_PX + 'px';
    div.style.minWidth = MONTH_PX + 'px';
    const isNow = m.getFullYear()===TODAY.getFullYear() && m.getMonth()===TODAY.getMonth();
    if(isNow) div.classList.add('now');
    // Mark FY27 April start
    if(m.getFullYear()===2026 && m.getMonth()===3) div.classList.add('fy-start');
    div.textContent = m.toLocaleDateString('en-GB',{month:'short',year:'2-digit'});
    container.appendChild(div);
  });
}

// ─── STATUS ──────────────────────────────────────────────────────────────────
function getStatus(p){
  const inProd = p.production && p.production.start <= TODAY && p.production.end >= TODAY;
  const inMkt  = p.inMarket   && p.inMarket.start   <= TODAY && p.inMarket.end   >= TODAY;
  const upcoming = (p.production && p.production.start > TODAY) ||
                   (!p.production && p.inMarket && p.inMarket.start > TODAY);
  if(inProd && inMkt) return 'active';
  if(inProd) return 'active';
  if(inMkt)  return 'inmarket';
  if(upcoming) return 'upcoming';
  return 'completed';
}

// ─── BUILD ROWS ──────────────────────────────────────────────────────────────
function buildRows(filter, search){
  const container = document.getElementById('ganttRows');
  container.innerHTML = '';

  const searchLC = search.toLowerCase();
  let visible = 0;
  let inProdCount = 0, inMktCount = 0, upcomingCount = 0;

  // Count totals regardless of filter
  projects.forEach(p => {
    const s = getStatus(p);
    if(s === 'active') inProdCount++;
    if(s === 'inmarket') inMktCount++;
    if(s === 'upcoming') upcomingCount++;
  });

  document.getElementById('statInProd').textContent  = inProdCount;
  document.getElementById('statInMkt').textContent   = inMktCount;

  projects.forEach(p => {
    const status = getStatus(p);
    // Filter
    if(filter === 'active'    && status !== 'active') return;
    if(filter === 'inmarket'  && status !== 'inmarket') return;
    if(filter === 'upcoming'  && status !== 'upcoming') return;
    // Search
    if(searchLC && !p.name.toLowerCase().includes(searchLC) && !p.code.toLowerCase().includes(searchLC)) return;

    visible++;
    const row = document.createElement('div');
    row.className = 'gantt-row';

    // Label
    const label = document.createElement('div');
    label.className = 'row-label';

    const statusLabels = {active:'In Production',inmarket:'In Market',upcoming:'Upcoming',completed:'Completed'};
    const statusCls = status === 'inmarket' ? 'active' : status;
    label.innerHTML = `
      <div class="row-name">${p.name}</div>
      <div style="display:flex;gap:6px;align-items:center;margin-top:2px">
        ${p.code ? `<div class="row-code">${p.code}</div>` : ''}
        <div class="row-status ${statusCls}">${statusLabels[status] || status}</div>
      </div>
    `;

    // Bars area
    const barsArea = document.createElement('div');
    barsArea.className = 'row-bars';
    barsArea.style.position = 'relative';
    barsArea.style.width = TOTAL_WIDTH + 'px';

    // FY27 highlight band
    const fyBand = document.createElement('div');
    fyBand.style.cssText = `position:absolute;top:0;bottom:0;left:${px(FY27_START)}px;width:${px(FY27_END)-px(FY27_START)}px;background:rgba(253,204,8,0.03);pointer-events:none;`;
    barsArea.appendChild(fyBand);

    // Grid lines per month
    let gcur = new Date(RANGE_START);
    while(gcur < RANGE_END){
      const gl = document.createElement('div');
      gl.className = 'grid-line';
      gl.style.left = px(gcur) + 'px';
      barsArea.appendChild(gl);
      gcur = new Date(gcur);
      gcur.setMonth(gcur.getMonth()+1);
    }

    // Today line
    if(TODAY >= RANGE_START && TODAY <= RANGE_END){
      const tl = document.createElement('div');
      tl.className = 'today-line';
      tl.style.left = px(TODAY) + 'px';
      const tlabel = document.createElement('div');
      tlabel.className = 'today-label';
      tlabel.textContent = 'Today';
      tl.appendChild(tlabel);
      barsArea.appendChild(tl);
    }

    // Production bar
    const prodTrack = document.createElement('div');
    prodTrack.className = 'bar-track';
    prodTrack.style.width = TOTAL_WIDTH + 'px';
    if(p.production){
      const left  = px(p.production.start);
      const right = px(p.production.end);
      const width = Math.max(6, right - left);
      const bar = document.createElement('div');
      bar.className = 'bar prod';
      bar.style.left  = left + 'px';
      bar.style.width = width + 'px';
      const label2 = width > 60 ? `${fmtDateShort(p.production.start)} – ${fmtDateShort(p.production.end)}` : '';
      bar.textContent = label2;
      bar.setAttribute('data-tip', `Production: ${fmtDate(p.production.start)} → ${fmtDate(p.production.end)}`);
      prodTrack.appendChild(bar);
    }
    barsArea.appendChild(prodTrack);

    // In Market bar
    const mktTrack = document.createElement('div');
    mktTrack.className = 'bar-track';
    mktTrack.style.width = TOTAL_WIDTH + 'px';
    if(p.inMarket){
      const left  = px(p.inMarket.start);
      const right = px(p.inMarket.end);
      const width = Math.max(6, right - left);
      const bar = document.createElement('div');
      bar.className = 'bar mkt';
      bar.style.left  = left + 'px';
      bar.style.width = width + 'px';
      const label2 = width > 60 ? `${fmtDateShort(p.inMarket.start)} – ${fmtDateShort(p.inMarket.end)}` : '';
      bar.textContent = label2;
      bar.setAttribute('data-tip', `In Market: ${fmtDate(p.inMarket.start)} → ${fmtDate(p.inMarket.end)}`);
      mktTrack.appendChild(bar);
    }
    barsArea.appendChild(mktTrack);

    // Project Brief Due bar
    const briefTrack = document.createElement('div');
    briefTrack.className = 'bar-track';
    briefTrack.style.width = TOTAL_WIDTH + 'px';
    if(p.projectBrief){
      const left  = px(p.projectBrief.start);
      const right = px(p.projectBrief.end);
      const width = Math.max(6, right - left);
      const bar = document.createElement('div');
      bar.className = width <= 8 ? 'bar brief brief-dot' : 'bar brief';
      bar.style.left  = left + 'px';
      bar.style.width = width + 'px';
      bar.textContent = width > 60 ? `${fmtDateShort(p.projectBrief.start)} – ${fmtDateShort(p.projectBrief.end)}` : '';
      bar.setAttribute('data-tip', `Project Brief Due: ${fmtDate(p.projectBrief.start)} → ${fmtDate(p.projectBrief.end)}`);
      briefTrack.appendChild(bar);
    }
    barsArea.appendChild(briefTrack);

    row.appendChild(label);
    row.appendChild(barsArea);
    container.appendChild(row);
  });

  document.getElementById('noResults').style.display = visible ? 'none' : 'block';
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildMonthHeaders();
document.getElementById('updatedDate').textContent = TODAY.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});

// Auto-scroll so Today is centred in the viewport
requestAnimationFrame(() => {
  const scroller = document.getElementById('timelineScroll');
  const viewW = scroller.clientWidth - 280; // subtract label col
  const todayX = px(TODAY);
  scroller.scrollLeft = Math.max(0, todayX - viewW / 2);
});

let activeFilter = 'all';
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    buildRows(activeFilter, document.getElementById('search').value);
  });
});
document.getElementById('search').addEventListener('input', e => {
  buildRows(activeFilter, e.target.value);
});

buildRows('all','');

</script>
</body>
</html>
